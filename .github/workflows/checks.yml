name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pex_ci
          POSTGRES_PASSWORD: ci-only-disposable-password
          POSTGRES_DB: pex_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pex_ci -d pex_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PEX_ENV: development
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ci-only-disposable-secret-not-for-production-000000000000000000000000
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_DB_HOST: 127.0.0.1
      DJANGO_DB_PORT: "5432"
      DJANGO_DB_NAME: pex_ci
      DJANGO_DB_USER: pex_ci
      DJANGO_DB_PASSWORD: ci-only-disposable-password
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.13.0"
          python-version: "3.12"
      - name: Synchronize locked dependencies
        run: uv sync --locked
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check Django configuration
        run: uv run --locked python manage.py check
      - name: Apply migrations to disposable PostgreSQL
        run: uv run --locked python manage.py migrate --noinput
      - name: Home smoke test
        run: uv run --locked pytest tests/test_home.py
      - name: Full test suite
        run: uv run --locked pytest
