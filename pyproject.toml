[project]
name = "pex"
version = "0.1.0"
description = "Personal Expense Analyzer development foundation"
requires-python = ">=3.12,<3.13"
dependencies = ["Django>=5.2,<5.3", "psycopg[binary]>=3.2,<4"]

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-django>=4.11,<5"]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "pex.settings"
testpaths = ["tests"]
